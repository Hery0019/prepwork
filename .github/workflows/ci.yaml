# CI de prepwork (CLAUDE.md §8) : vérifications de l'outil sur chaque commit, puis une matrice de
# génération par pack sur les pull requests. Chaque projet généré est vérifié par son propre
# outillage : `mvn verify` côté spring-boot, `lint` + `test` + `build` côté react.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  spring-boot-matrix:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [layered, modular]
        security: [none, session, oauth2-resource-server]
        migrations: [flyway, liquibase, none]
    name: spring-boot ${{ matrix.profile }} / ${{ matrix.security }} / ${{ matrix.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - name: Generate
        run: pnpm matrix spring-boot out ${{ matrix.profile }} ${{ matrix.security }} ${{ matrix.migrations }} postgresql
      - name: Verify the generated project
        working-directory: out
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  react-matrix:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data: [tanstack-query, none]
        forms: [rhf, none]
        security: [none, oidc-bff, session]
    name: react ${{ matrix.data }} / ${{ matrix.forms }} / ${{ matrix.security }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate
        run: pnpm matrix react out ${{ matrix.data }} ${{ matrix.forms }} ${{ matrix.security }}
      - name: Verify the generated project
        working-directory: out
        run: |
          cp .env.example .env
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
