# yaml-language-server: $schema=../../../schema/fastapi/core.schema.json
# Sécurité de base (CLAUDE.md §4), indépendante de l'option security-*.
id: security
skill: security
title:
  en: Baseline security
  fr: Sécurité de base
rules:
  - id: CORE-030
    statement:
      en: Secrets and environment-specific values come from environment variables read by a `pydantic-settings` class; `.env.example` is committed and `.env` is ignored.
      fr: Les secrets et valeurs propres à un environnement viennent de variables d'environnement lues par une classe `pydantic-settings` ; `.env.example` est commité et `.env` est ignoré.
    rationale:
      en: Configuration that differs per environment must never be a code change, and a typed settings class fails at startup rather than at the first request.
      fr: Une configuration qui diffère par environnement ne doit jamais être un changement de code, et une classe de réglages typée échoue au démarrage plutôt qu'à la première requête.
    enforced_by: gitleaks
  - id: CORE-031
    statement:
      en: No credential, token or private key is ever committed; the gitleaks pre-commit hook blocks the commit.
      fr: Aucun identifiant, jeton ou clé privée n'est jamais commité ; le hook pre-commit gitleaks bloque le commit.
    rationale:
      en: A secret in history is compromised even after it is removed.
      fr: Un secret dans l'historique est compromis même après sa suppression.
    enforced_by: gitleaks
  - id: CORE-032
    statement:
      en: The only diagnostic endpoint exposed is `/health`; no endpoint returns configuration, environment or dumps.
      fr: Le seul endpoint de diagnostic exposé est `/health` ; aucun endpoint ne renvoie la configuration, l'environnement ou des dumps.
    rationale:
      en: A diagnostics endpoint is a configuration leak waiting for the first scan.
      fr: Un endpoint de diagnostic est une fuite de configuration qui attend le premier scan.
    enforced_by: none
  - id: CORE-033
    statement:
      en: CORS origins are an explicit list read from settings; `allow_origins=["*"]` is never used outside local development.
      fr: Les origines CORS sont une liste explicite lue depuis les réglages ; `allow_origins=["*"]` n'est jamais utilisé hors développement local.
    rationale:
      en: A wildcard origin turns every browser into a client of the API.
      fr: Une origine joker fait de chaque navigateur un client de l'API.
    enforced_by: none
  - id: CORE-034
    statement:
      en: The response security headers set by the middleware (`X-Content-Type-Options`, `X-Frame-Options`, HSTS) are never removed without an ADR.
      fr: Les en-têtes de sécurité posés par le middleware (`X-Content-Type-Options`, `X-Frame-Options`, HSTS) ne sont jamais retirés sans ADR.
    rationale:
      en: Starlette sets none of them by default; the skeleton adds them and each one closes a class of browser attacks for free.
      fr: Starlette n'en pose aucun par défaut ; le squelette les ajoute et chacun ferme gratuitement une classe d'attaques navigateur.
    enforced_by: none
  - id: CORE-035
    statement:
      en: A dependency carrying a known vulnerability fails the pipeline, `pip-audit` running on the resolved lockfile.
      fr: Une dépendance porteuse d'une vulnérabilité connue fait échouer le pipeline, `pip-audit` tournant sur le lockfile résolu.
    rationale:
      en: Most breaches exploit a known, already patched vulnerability.
      fr: La plupart des intrusions exploitent une vulnérabilité connue et déjà corrigée.
    enforced_by: pip-audit
  - id: CORE-036
    statement:
      en: The interactive documentation and the OpenAPI schema are served only when `APP_ENV` is not `production`.
      fr: La documentation interactive et le schéma OpenAPI ne sont servis que lorsque `APP_ENV` ne vaut pas `production`.
    rationale:
      en: '`/docs` publishes every route, every schema and every field name to anyone who asks.'
      fr: '`/docs` publie chaque route, chaque schéma et chaque nom de champ à qui le demande.'
    enforced_by: pytest
  - id: CORE-037
    statement:
      en: The 500 handler answers a problem document without the traceback; the traceback goes to the logs only.
      fr: Le gestionnaire 500 répond un document problème sans le traceback ; le traceback ne va que dans les logs.
    rationale:
      en: A traceback hands an attacker the library versions and the internal file layout.
      fr: Un traceback donne à un attaquant les versions des bibliothèques et l'arborescence interne.
    enforced_by: pytest
anti_patterns:
  - id: CORE-AP-030
    statement:
      en: A password or API key written as a default value in the settings class.
      fr: Un mot de passe ou une clé d'API écrit comme valeur par défaut dans la classe de réglages.
    rationale:
      en: The value is committed, shared and impossible to rotate per environment.
      fr: La valeur est commitée, partagée et impossible à faire tourner par environnement.
    enforced_by: gitleaks
    instead:
      en: A field without a default, documented in `.env.example`, so a missing value fails at startup.
      fr: Un champ sans valeur par défaut, documenté dans `.env.example`, pour qu'une valeur absente échoue au démarrage.
  - id: CORE-AP-031
    statement:
      en: '`FastAPI(debug=True)` left on outside local development to "help debugging in staging".'
      fr: '`FastAPI(debug=True)` laissé actif hors développement local pour « aider à déboguer en recette ».'
    rationale:
      en: Staging is reachable and the debug response prints the exception and the source.
      fr: La recette est joignable et la réponse de debug affiche l'exception et le source.
    enforced_by: none
    instead:
      en: Read the logs, which carry the same information without publishing it.
      fr: Lire les logs, qui portent la même information sans la publier.
  - id: CORE-AP-032
    statement:
      en: '`allow_origins=["*"]` with `allow_credentials=True` to make a local front end work.'
      fr: '`allow_origins=["*"]` avec `allow_credentials=True` pour faire marcher un front local.'
    rationale:
      en: The shortcut ships to production because nobody remembers it, and the browser sends the cookies with it.
      fr: Le raccourci part en production parce que personne ne s'en souvient, et le navigateur envoie les cookies avec.
    enforced_by: none
    instead:
      en: The local origin in the development settings and the real one in production.
      fr: L'origine locale dans les réglages de développement et la vraie en production.
