# yaml-language-server: $schema=../../../../schema/fastapi/option.schema.json
# Pipeline GitHub Actions. Exclusive avec ci-gitlab.
meta:
  id: ci-github
  version: 1.0.0
  rule_prefix: CIGH
  group: ci
  summary:
    en: GitHub Actions pipeline running the checks, the three test levels and the migration check.
    fr: Pipeline GitHub Actions qui exécute les vérifications, les trois niveaux de test et le contrôle des migrations.
skill: workflow
rules:
  - id: CIGH-001
    statement:
      en: The pipeline runs `ruff format --check`, `ruff check`, `mypy`, `lint-imports` and `pytest` on every push and pull request.
      fr: Le pipeline exécute `ruff format --check`, `ruff check`, `mypy`, `lint-imports` et `pytest` à chaque push et pull request.
    rationale:
      en: CI must run exactly what a developer can run locally, no more and no less.
      fr: La CI doit exécuter exactement ce qu'un développeur peut lancer localement, ni plus ni moins.
    enforced_by: format
  - id: CIGH-002
    statement:
      en: '`lint-imports` is a step of its own, never folded into the lint step.'
      fr: "`lint-imports` est une étape à part entière, jamais fondue dans l'étape de lint."
    rationale:
      en: It is the only thing holding the architecture; a failure must name the layer contract, not "lint failed".
      fr: C'est la seule chose qui tient l'architecture ; un échec doit nommer le contrat de couches, pas « lint failed ».
    enforced_by: import-linter
  - id: CIGH-003
    statement:
      en: The Python version comes from `.python-version` and the dependencies from `uv.lock` through `uv sync --frozen`; the workflow never pins another one.
      fr: La version de Python vient de `.python-version` et les dépendances de `uv.lock` via `uv sync --frozen` ; le workflow n'en épingle jamais d'autre.
    rationale:
      en: Two sources of truth for a version produce a green CI and a red machine.
      fr: Deux sources de vérité pour une version produisent une CI verte et une machine rouge.
    enforced_by: none
  - id: CIGH-004
    statement:
      en: A red pipeline blocks the merge; nothing is merged with a failing check.
      fr: Un pipeline rouge bloque la fusion ; rien n'est fusionné avec une vérification en échec.
    rationale:
      en: A check that can be ignored stops being a check.
      fr: Une vérification qu'on peut ignorer cesse d'être une vérification.
    enforced_by: none
