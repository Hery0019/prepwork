# yaml-language-server: $schema=../../../../schema/fastapi/option.schema.json
# Persistance SQLAlchemy et Alembic. Présente dès qu'une base de données est choisie ; il n'y a pas
# d'autre outil de migration dans ce pack (ADR 0011 §5), donc pas de groupe d'exclusivité.
meta:
  id: persistence-sqlalchemy
  version: 1.0.0
  rule_prefix: PERS
  summary:
    en: SQLAlchemy persistence, Alembic migrations and the Testcontainers fixture of the integration tests.
    fr: Persistance SQLAlchemy, migrations Alembic et fixture Testcontainers des tests d'intégration.
skill: db
rules:
  - id: PERS-001
    statement:
      en: A model change without its migration fails the pipeline (`alembic check`).
      fr: Un changement du modèle sans sa migration fait échouer le pipeline (`alembic check`).
    rationale:
      en: The gap between the model and the schema is otherwise found in production, not in review.
      fr: L'écart entre le modèle et le schéma se découvre sinon en production, pas en revue.
    enforced_by: alembic
  - id: PERS-002
    statement:
      en: A migration already merged is never edited; a correction is a new migration.
      fr: Une migration déjà fusionnée n'est jamais modifiée ; une correction est une nouvelle migration.
    rationale:
      en: Editing an applied migration desynchronises every environment that already ran it.
      fr: Modifier une migration appliquée désynchronise tous les environnements qui l'ont déjà exécutée.
    enforced_by: none
  - id: PERS-003
    statement:
      en: A migration generated by autogenerate is read and corrected before being committed.
      fr: Une migration produite par autogenerate est relue et corrigée avant d'être commitée.
    rationale:
      en: Autogenerate misses renames, server defaults and index changes, and writes a drop plus a create instead.
      fr: L'autogenerate rate les renommages, les valeurs par défaut serveur et les changements d'index, et écrit un drop suivi d'un create à la place.
    enforced_by: none
  - id: PERS-004
    statement:
      en: The schema is never created by `Base.metadata.create_all()`, in tests included; migrations are the only path.
      fr: Le schéma n'est jamais créé par `Base.metadata.create_all()`, tests compris ; les migrations sont le seul chemin.
    rationale:
      en: A schema created two ways is two schemas, and the migrations are only tested in production.
      fr: Un schéma créé de deux façons fait deux schémas, et les migrations ne sont testées qu'en production.
    enforced_by: pytest
  - id: PERS-005
    statement:
      en: The engine and the session factory are created once, at application startup, and disposed at shutdown.
      fr: Le moteur et la fabrique de sessions sont créés une fois, au démarrage de l'application, et libérés à l'arrêt.
    rationale:
      en: An engine per request opens a connection pool per request and exhausts the database.
      fr: Un moteur par requête ouvre un pool de connexions par requête et épuise la base.
    enforced_by: none
  - id: PERS-006
    statement:
      en: 'A request is one transaction: the session dependency commits on success and rolls back on exception.'
      fr: "Une requête est une transaction : la dépendance de session commite en cas de succès et annule en cas d'exception."
    rationale:
      en: A half-written request is worse than a failed one, and nobody finds it afterwards.
      fr: Une requête à moitié écrite est pire qu'une requête échouée, et personne ne la retrouve après coup.
    enforced_by: none
  - id: PERS-007
    statement:
      en: Relationships are loaded explicitly (`selectinload`, `joinedload`); lazy loading is disabled on the async session.
      fr: Les relations sont chargées explicitement (`selectinload`, `joinedload`) ; le chargement paresseux est désactivé sur la session asynchrone.
    rationale:
      en: Lazy loading raises at await time under asyncio, and hides an N+1 query when it does work.
      fr: Le chargement paresseux lève à l'await sous asyncio, et cache une requête N+1 quand il fonctionne.
    enforced_by: none
anti_patterns:
  - id: PERS-AP-001
    statement:
      en: Calling `create_all()` in the test fixture because "migrations are slow".
      fr: Appeler `create_all()` dans la fixture de test parce que « les migrations sont lentes ».
    rationale:
      en: The suite then tests a schema that no environment will ever have.
      fr: La suite teste alors un schéma qu'aucun environnement n'aura jamais.
    enforced_by: none
    instead:
      en: Run `alembic upgrade head` once against the Testcontainers database.
      fr: Lancer `alembic upgrade head` une fois sur la base Testcontainers.
  - id: PERS-AP-002
    statement:
      en: Writing raw SQL through `session.execute(text(...))` for an ordinary read.
      fr: Écrire du SQL brut via `session.execute(text(...))` pour une lecture ordinaire.
    rationale:
      en: The query escapes typing, escapes the migrations and breaks silently when a column is renamed.
      fr: La requête échappe au typage, échappe aux migrations et casse en silence quand une colonne est renommée.
    enforced_by: none
    instead:
      en: A `select()` statement, which mypy checks and which follows the model.
      fr: Une instruction `select()`, que mypy vérifie et qui suit le modèle.
  - id: PERS-AP-003
    statement:
      en: A migration that carries a data backfill in the same revision as the schema change.
      fr: Une migration qui porte une reprise de données dans la même révision que le changement de schéma.
    rationale:
      en: The backfill locks the table for the whole deployment and cannot be replayed alone.
      fr: La reprise verrouille la table pendant tout le déploiement et ne peut pas être rejouée seule.
    enforced_by: none
    instead:
      en: A schema revision, then a separate data revision that can be rerun.
      fr: Une révision de schéma, puis une révision de données séparée, rejouable.
env:
  - name: DATABASE_URL
    example: postgresql+asyncpg://app:app@localhost:5432/app
    comment:
      en: Async SQLAlchemy URL; the driver is part of it and must match the chosen database.
      fr: URL SQLAlchemy asynchrone ; le driver en fait partie et doit correspondre à la base choisie.
python:
  packages:
    - id: sqlalchemy
      version: '2.0.52'
      group: main
      purpose:
        en: The ORM and the statement builder.
        fr: L'ORM et le constructeur d'instructions.
    - id: alembic
      version: '1.19.2'
      group: main
      purpose:
        en: Schema migrations, and `alembic check` in the pipeline.
        fr: Migrations de schéma, et `alembic check` dans le pipeline.
    - id: asyncpg
      version: '0.31.0'
      group: main
      when: stack.database == 'postgresql'
      purpose:
        en: PostgreSQL async driver.
        fr: Driver PostgreSQL asynchrone.
    - id: asyncmy
      version: '0.2.14'
      group: main
      when: stack.database == 'mysql'
      purpose:
        en: MySQL async driver.
        fr: Driver MySQL asynchrone.
    - id: testcontainers
      version: '4.15.0'
      group: dev
      purpose:
        en: Starts the real database engine for the integration level (CORE-021).
        fr: Démarre le vrai moteur de base pour le niveau intégration (CORE-021).
