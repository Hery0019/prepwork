# yaml-language-server: $schema=../../../../schema/react/option.schema.json
# Intégration continue GitHub Actions.
meta:
  id: ci-github
  version: 1.0.0
  rule_prefix: CIGH
  group: ci
  summary:
    en: A GitHub Actions workflow runs the checks on every pull request.
    fr: Un workflow GitHub Actions lance les vérifications sur chaque pull request.
skill: workflow
rules:
  - id: CIGH-001
    statement:
      en: The workflow runs the type check, the lint, the tests and the build on every pull request.
      fr: Le workflow lance la vérification de types, le lint, les tests et le build sur chaque pull request.
    rationale:
      en: What the machine does not check on the branch is checked by the user in production.
      fr: Ce que la machine ne vérifie pas sur la branche, c'est l'utilisateur qui le vérifie en production.
    enforced_by: none
  - id: CIGH-002
    statement:
      en: Dependencies are installed from the lockfile with a frozen install.
      fr: Les dépendances sont installées depuis le fichier de verrouillage avec une installation figée.
    rationale:
      en: A resolution that differs from the local one turns CI into a lottery.
      fr: Une résolution différente de celle du poste transforme la CI en loterie.
    enforced_by: none
