# Conventions git du projet.
meta:
  id: git
  version: 1.0.0
  rule_prefix: GIT
  summary:
    en: Conventional commits, no secret committed, commands forbidden to the agent.
    fr: Commits conventionnels, aucun secret commité, commandes interdites à l'agent.
skill: workflow
rules:
  - id: GIT-001
    statement:
      en: A commit message follows the Conventional Commits format; the `commit-msg` hook refuses anything else.
      fr: Un message de commit suit le format Conventional Commits ; le hook `commit-msg` refuse tout le reste.
    rationale:
      en: A readable history is the cheapest documentation a team ever writes.
      fr: Un historique lisible est la documentation la moins chère qu'une équipe écrive jamais.
    enforced_by: commitlint
  - id: GIT-002
    statement:
      en: The `pre-commit` hook runs gitleaks and refuses the commit when a secret is detected.
      fr: Le hook `pre-commit` lance gitleaks et refuse le commit quand un secret est détecté.
    rationale:
      en: A secret pushed once must be considered compromised, whatever happens next.
      fr: Un secret poussé une fois doit être considéré comme compromis, quoi qu'il arrive ensuite.
    enforced_by: gitleaks
  - id: GIT-003
    statement:
      en: The agent never runs `git push`, `git reset --hard` or `git clean`.
      fr: L'agent ne lance jamais `git push`, `git reset --hard` ni `git clean`.
    rationale:
      en: These three commands destroy work that only the team can decide to lose.
      fr: Ces trois commandes détruisent un travail que seule l'équipe peut décider de perdre.
    enforced_by: none
