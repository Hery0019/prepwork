# yaml-language-server: $schema=../../../../schema/react/files.schema.json
# Squelette du profil spa-feature : coquille applicative, entité `note` et feature `notes`.
# Les variantes suivent la stack (bibliothèque de données, bibliothèque de formulaires), jamais
# les options : un profil ne connaît pas les options.
files:
  # --- frontières outillées : la configuration décrit les couches de ce profil ----------
  - source: eslint.config.js.eta
    target: eslint.config.js
  - source: .dependency-cruiser.cjs.eta
    target: .dependency-cruiser.cjs

  # --- app -------------------------------------------------------------------------------
  - source: src/app/App.tsx.eta
    target: src/app/App.tsx
  - source: src/app/routes.tsx.eta
    target: src/app/routes.tsx

  # --- entité ----------------------------------------------------------------------------
  - source: src/entities/note/model/note.ts.eta
    target: src/entities/note/model/note.ts
  - source: src/entities/note/model/note.test.ts.eta
    target: src/entities/note/model/note.test.ts
  - source: src/entities/note/ui/NoteCard.tsx.eta
    target: src/entities/note/ui/NoteCard.tsx
  - source: src/entities/note/index.ts.eta
    target: src/entities/note/index.ts

  # --- feature notes ---------------------------------------------------------------------
  - source: src/features/notes/api/notesApi.ts.eta
    target: src/features/notes/api/notesApi.ts
  - source: src/features/notes/api/handlers.ts.eta
    target: src/features/notes/api/handlers.ts
  - source: src/features/notes/model/useNotes.ts.eta
    target: src/features/notes/model/useNotes.ts
    when: stack.data == 'tanstack-query'
  - source: src/features/notes/model/useNotes.nodata.ts.eta
    target: src/features/notes/model/useNotes.ts
    when: stack.data == 'none'
  - source: src/features/notes/ui/NoteList.tsx.eta
    target: src/features/notes/ui/NoteList.tsx
  - source: src/features/notes/ui/NoteList.test.tsx.eta
    target: src/features/notes/ui/NoteList.test.tsx
  - source: src/features/notes/ui/NoteDetail.tsx.eta
    target: src/features/notes/ui/NoteDetail.tsx
  - source: src/features/notes/ui/NoteForm.tsx.eta
    target: src/features/notes/ui/NoteForm.tsx
    when: stack.forms == 'rhf'
  - source: src/features/notes/ui/NoteForm.noforms.tsx.eta
    target: src/features/notes/ui/NoteForm.tsx
    when: stack.forms == 'none'
  - source: src/features/notes/index.ts.eta
    target: src/features/notes/index.ts
