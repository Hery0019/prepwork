# yaml-language-server: $schema=../../schema/core.schema.json
# Sécurité de base (CLAUDE.md §4), indépendante de l'option security-*.
id: security
skill: security
title:
  en: Baseline security
  fr: Sécurité de base
rules:
  - id: CORE-030
    statement:
      en: Secrets and environment-specific values come from environment variables; `.env.example` is committed and `.env` is ignored.
      fr: Les secrets et valeurs propres à un environnement viennent de variables d'environnement ; `.env.example` est commité et `.env` est ignoré.
    rationale:
      en: Configuration that differs per environment must never be a code change.
      fr: Une configuration qui diffère par environnement ne doit jamais être un changement de code.
    enforced_by: gitleaks
  - id: CORE-031
    statement:
      en: No credential, token or private key is ever committed; the gitleaks pre-commit hook blocks the commit.
      fr: Aucun identifiant, jeton ou clé privée n'est jamais commité ; le hook pre-commit gitleaks bloque le commit.
    rationale:
      en: A secret in history is compromised even after it is removed.
      fr: Un secret dans l'historique est compromis même après sa suppression.
    enforced_by: gitleaks
  - id: CORE-032
    statement:
      en: Actuator exposes only the `health` and `info` endpoints.
      fr: Actuator n'expose que les endpoints `health` et `info`.
    rationale:
      en: The other endpoints leak configuration, environment and heap dumps.
      fr: Les autres endpoints exposent la configuration, l'environnement et des dumps mémoire.
    enforced_by: none
  - id: CORE-033
    statement:
      en: CORS origins are an explicit list read from configuration; `*` is never used in `prod`.
      fr: Les origines CORS sont une liste explicite lue depuis la configuration ; `*` n'est jamais utilisé en `prod`.
    rationale:
      en: A wildcard origin turns every browser into a client of the API.
      fr: Une origine joker fait de chaque navigateur un client de l'API.
    enforced_by: none
  - id: CORE-034
    statement:
      en: Default security headers (content type options, frame options, HSTS, cache control) are never disabled without an ADR.
      fr: Les en-têtes de sécurité par défaut (content type options, frame options, HSTS, cache control) ne sont jamais désactivés sans ADR.
    rationale:
      en: Each header closes a class of browser attacks for free.
      fr: Chaque en-tête ferme gratuitement une classe d'attaques navigateur.
    enforced_by: none
  - id: CORE-035
    statement:
      en: Dependencies are scanned for known vulnerabilities in CI, and a critical finding blocks the release.
      fr: Les dépendances sont analysées en CI pour les vulnérabilités connues, et une criticité bloque la livraison.
    rationale:
      en: Most breaches exploit a known, already patched vulnerability.
      fr: La plupart des intrusions exploitent une vulnérabilité connue et déjà corrigée.
    enforced_by: dependency-check
anti_patterns:
  - id: CORE-AP-030
    statement:
      en: A password or API key written in `application.yaml`.
      fr: Un mot de passe ou une clé d'API écrit dans `application.yaml`.
    rationale:
      en: The value is committed, shared and impossible to rotate per environment.
      fr: La valeur est commitée, partagée et impossible à faire tourner par environnement.
    enforced_by: gitleaks
    instead:
      en: '`${DB_PASSWORD}` in the configuration and the variable documented in `.env.example`.'
      fr: '`${DB_PASSWORD}` dans la configuration et la variable documentée dans `.env.example`.'
  - id: CORE-AP-031
    statement:
      en: '`management.endpoints.web.exposure.include: ''*''` to "see everything".'
      fr: "`management.endpoints.web.exposure.include: '*'` pour « tout voir »."
    rationale:
      en: Environment variables, beans and thread dumps become public.
      fr: Variables d'environnement, beans et dumps de threads deviennent publics.
    enforced_by: none
    instead:
      en: Keep `health,info` and read the rest from the logs or a metrics backend.
      fr: Garder `health,info` et lire le reste dans les logs ou un backend de métriques.
  - id: CORE-AP-032
    statement:
      en: '`allowedOrigins("*")` to make a local front end work.'
      fr: '`allowedOrigins("*")` pour faire marcher un front local.'
    rationale:
      en: The shortcut ships to production because nobody remembers it.
      fr: Le raccourci part en production parce que personne ne s'en souvient.
    enforced_by: none
    instead:
      en: The local origin in the `dev` configuration and the real one in `prod`.
      fr: L'origine locale dans la configuration `dev` et la vraie en `prod`.
