<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="400" viewBox="0 0 1002 400" role="img" aria-label="$ prepwork init pay-flow --scaffold pay-flow.yaml">
  <rect width="1002" height="400" rx="8" fill="#11141a" stroke="#272d38"/>
