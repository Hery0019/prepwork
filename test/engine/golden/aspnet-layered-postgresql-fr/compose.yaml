# DOCK-004 : environnement local uniquement. Le déploiement réel se décrit ailleurs.
# Le mot de passe ci-dessous est local et jetable : il ne vaut que pour ce conteneur.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_CONNECTION_STRING: Host=db;Port=5432;Database=pay_flow;Username=pay_flow;Password=local_dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pay_flow
      POSTGRES_USER: pay_flow
      POSTGRES_PASSWORD: local_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
