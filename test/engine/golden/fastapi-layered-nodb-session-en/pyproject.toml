# Generated by prepwork. Dependencies come from the catalogue: `uv add`, then carry the change back to the source.
[project]
name = "edge-api"
version = "0.1.0"
description = "Stateless edge API"
requires-python = "==3.13.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "passlib==1.7.4",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]

# `src/` layout: tests import the installed package, not the working directory.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_api"]

# CORE-053: lint and format are a single tool, and the configuration lives here.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

# A test carries the identifier of the rule it proves — `test_CORE_011_...` — and that convention is what the catalogue consistency check verifies. An identifier's capitals therefore win over N802, and only in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# CORE-050: strict typing plays the compiler role here. No module is excluded (CORE-AP-051).
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# CORE-023: one level marker per test; `-m "not integration"` is what runs without Docker.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit level, no application",
    "slice: slice level, application with the service layer substituted",
    "integration: integration level, Testcontainers on the real database",
]
