# Reference local environment (DOCK-003). `./mvnw spring-boot:run` starts the database automatically; `docker compose up` also runs the application.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shop_api
      MYSQL_USER: shop_api
      MYSQL_PASSWORD: shop_api
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  app:
    build: .
    image: shop-api:local
    labels:
      # Ignored by Spring Boot Docker Compose support: only `db` is started by `spring-boot:run`.
      org.springframework.boot.ignore: true
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_URL: jdbc:mysql://db:3306/shop_api
      DB_USERNAME: shop_api
      DB_PASSWORD: shop_api
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
