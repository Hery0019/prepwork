# Generated by prepwork. Secrets come from environment variables (see .env.example).
spring:
  application:
    name: shop-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop_api}
    username: ${DB_USERNAME:shop_api}
    password: ${DB_PASSWORD:shop_api}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    enabled: true
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:change-me}

---
# Local development: readable, verbose logs for the project package.
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.acme.shop: DEBUG

---
# Production: JSON logs (ECS), never any personal data (CORE-016).
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
