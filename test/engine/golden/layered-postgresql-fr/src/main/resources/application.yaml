# Généré par prepwork. Les secrets viennent de variables d'environnement (voir .env.example).
spring:
  application:
    name: pay-flow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pay_flow}
    username: ${DB_USERNAME:pay_flow}
    password: ${DB_PASSWORD:pay_flow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# Développement local : logs lisibles et verbeux pour le package du projet.
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    mg.solumada.payflow: DEBUG

---
# Production : logs JSON (ECS), jamais de donnée personnelle (CORE-016).
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
