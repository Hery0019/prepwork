# Généré par prepwork. Les secrets viennent de variables d'environnement (voir .env.example).
spring:
  application:
    name: pay-flow
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:https://issuer.example.com/realms/app}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    enabled: true

---
# Développement local : logs lisibles et verbeux pour le package du projet.
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    mg.solumada.payflow: DEBUG

---
# Production : logs JSON (ECS), jamais de donnée personnelle (CORE-016).
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
