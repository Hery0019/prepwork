# Serveur statique de l'application. Une SPA renvoie index.html pour toute route inconnue.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CORE-075 : une politique de sécurité du contenu est servie en production.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' API_ORIGIN;" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
